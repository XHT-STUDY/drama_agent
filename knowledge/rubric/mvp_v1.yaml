# DramaAgent MVP 剧本评估标准 (Rubric) v1.0.0
#
# 评估契约（§5.8 / Phase E-01）：
# - 9 个维度，权重和为 1.0（与 backend/app/domain/enums.py DEFAULT_EVALUATION_WEIGHTS 一致）
# - 维度分由模型给出（0-100），overall_score / need_revision 由服务端确定性规则计算
# - anchors 描述 1/3/5 三档锚点，用于引导模型给出稳定的维度分
# - 权重变更时必须同步升级 rubric_version 并更新此处与 enums.py

rubric:
  version: "1.0.0"
  description: "中文短剧单集剧本 9 维评估标准（MVP）"
  score_rules:
    revision_threshold: 75        # overall < 75 触发 need_revision
    compliance_threshold: 60      # compliance_safety < 60 独立触发 need_revision
    need_revision: "overall < 75 或存在 severity=high 的问题 或 compliance_safety < 60"
  dimensions:
    - dimension: opening_hook
      label: "开头钩子"
      weight: 0.15
      description: "开场是否在前 1/3 内建立悬念或冲突，快速抓住观众。"
      anchors:
        1: "开场平淡，直接进入背景交代，无悬念无冲突，观众无继续观看动机"
        3: "开场有轻量冲突或悬念，但冲击力不足或铺垫过长"
        5: "开场即抛出强悬念/尖锐冲突，观众立刻产生观看动机"
    - dimension: main_clarity
      label: "主线清晰度"
      weight: 0.10
      description: "本集目标、冲突与主线是否清晰，观众能否理解剧情推进逻辑。"
      anchors:
        1: "主线模糊，本集目标不明，剧情推进缺乏逻辑"
        3: "主线基本可辨，但部分转折生硬或动机交代不清"
        5: "主线清晰聚焦，目标/障碍/推进一目了然"
    - dimension: character_appeal
      label: "角色吸引力"
      weight: 0.10
      description: "角色是否有辨识度、动机与成长弧，观众是否对其产生情感投入。"
      anchors:
        1: "角色扁平，动机不明，言行缺乏一致性"
        3: "角色有基本辨识度，但性格单薄或成长不足"
        5: "角色立体、动机可信、有记忆点，观众有情感代入"
    - dimension: conflict_intensity
      label: "冲突强度"
      weight: 0.15
      description: "本集冲突是否尖锐、有层次、有对抗张力。"
      anchors:
        1: "无有效冲突，剧情平铺直叙，角色间无对抗"
        3: "存在冲突但力度不足，或冲突解决过于轻易"
        5: "冲突尖锐且多层级，对抗张力持续到本集结束"
    - dimension: payoff_density
      label: "爽点密度"
      weight: 0.15
      description: "短剧节奏下，本集是否包含足够的高光/反转/情绪释放点。"
      anchors:
        1: "无爽点，无反转，情绪全程平缓"
        3: "有 1-2 个轻量爽点，但密度偏低或爆发力不足"
        5: "爽点密集且分布合理，反转有力，情绪释放到位"
    - dimension: ending_hook
      label: "结尾钩子"
      weight: 0.15
      description: "本集结尾是否为下一集留下强悬念或期待。"
      anchors:
        1: "结尾无钩子，剧情到此自然结束，缺乏追看动力"
        3: "结尾有轻量悬念，但冲击力或延续性不足"
        5: "结尾抛出强悬念/身份反转，强烈驱动观众追下一集"
    - dimension: pacing
      label: "节奏"
      weight: 0.10
      description: "场景推进与对白节奏是否紧凑，有无冗余拖沓。"
      anchors:
        1: "节奏拖沓，大量无效场景/对白，信息密度低"
        3: "节奏基本可用，但存在若干冗余段落"
        5: "节奏紧凑，场景切换高效，信息密度与情绪曲线匹配"
    - dimension: visualizability
      label: "画面感"
      weight: 0.05
      description: "动作描写与场景是否具备可拍摄的画面感，是否依赖抽象叙述。"
      anchors:
        1: "大量抽象叙述/心理独白，缺乏可拍摄动作，无法直接分镜"
        3: "部分场景可拍摄，但动作描写笼统或过少"
        5: "动作与场景描写具体可拍，可直接转化为镜头语言"
    - dimension: compliance_safety
      label: "合规安全"
      weight: 0.05
      description: "内容是否符合平台合规与内容安全要求，无红线风险。"
      anchors:
        1: "存在明显红线风险（违法、色情、诱导不良行为等）"
        3: "存在边缘表述或可能引发争议的内容"
        5: "内容安全，无合规风险，符合平台规范"
