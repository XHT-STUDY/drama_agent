# DramaAgent MVP 剧本评估标准 (Rubric) v2.0.0
#
# 评估契约（§5.8 / 评估可解释性升级）：
# - 9 个维度，权重和为 1.0（与 backend/app/domain/enums.py DEFAULT_EVALUATION_WEIGHTS 一致）
# - 锚点扩展为 1-5 共 5 档，每档有独立描述；score_bands 定义档位 → 分数区间映射
# - 服务端强制"分数落在所定位档位的分带内"（分带 clamp），保证分数与标准自洽
# - 每个维度附 signals（可观察信号），引导评估引用剧本中可核对的具体事实
# - 维度分由模型定位档位 + 给出档内分数；overall_score / need_revision 仍由服务端确定性规则计算
# - 权重或分带变更时必须同步升级 rubric_version 并更新此处与 enums.py

rubric:
  version: "2.0.0"
  description: "中文短剧单集剧本 9 维评估标准（v2：5 档锚点 + 分带映射 + 可观察信号）"
  score_bands:
    1: [0, 44]      # 1 档：明显不达标
    2: [45, 59]     # 2 档：低于预期
    3: [60, 74]     # 3 档：基本可用
    4: [75, 89]     # 4 档：表现良好（75 分即修订阈值，与 4 档下界对齐）
    5: [90, 100]    # 5 档：出色
  score_rules:
    revision_threshold: 75        # overall < 75 触发 need_revision（= 4 档分带下界）
    compliance_threshold: 60      # compliance_safety < 60 独立触发 need_revision
    need_revision: "overall < 75 或存在 severity=high 的问题 或 compliance_safety < 60"
  dimensions:
    - dimension: opening_hook
      label: "开头钩子"
      weight: 0.15
      description: "开场是否在前 1/3 内建立悬念或冲突，快速抓住观众。"
      signals:
        - "危机/冲突/悬念事件出现在第几场、第几句"
        - "开场是否直接交代背景而非抛出事件"
        - "开场是否有未解释的反常行为或身份反差"
      anchors:
        1: "开场平淡，直接进入背景交代，无悬念无冲突，观众无继续观看动机"
        2: "开场有微弱冲突或异常信号，但被大量铺垫稀释，抓人力度不足"
        3: "开场有轻量冲突或悬念，但冲击力不足或铺垫过长"
        4: "开场在前 1/3 内建立明确冲突或悬念，观众有清晰观看动机"
        5: "开场即抛出强悬念/尖锐冲突，观众立刻产生观看动机"
    - dimension: main_clarity
      label: "主线清晰度"
      weight: 0.10
      description: "本集目标、冲突与主线是否清晰，观众能否理解剧情推进逻辑。"
      signals:
        - "本集目标是否在前 1/3 内可被观众概括"
        - "每次剧情推进是否有明确动机支撑"
        - "是否存在与本集主线无关的支线干扰"
      anchors:
        1: "主线模糊，本集目标不明，剧情推进缺乏逻辑"
        2: "主线可辨但目标摇摆，部分推进缺乏动机，观众需要猜测"
        3: "主线基本可辨，但部分转折生硬或动机交代不清"
        4: "主线清晰，目标/障碍/推进逻辑完整，仅个别转折略生硬"
        5: "主线清晰聚焦，目标/障碍/推进一目了然"
    - dimension: character_appeal
      label: "角色吸引力"
      weight: 0.10
      description: "角色是否有辨识度、动机与成长弧，观众是否对其产生情感投入。"
      signals:
        - "主角是否有可概括的记忆点（口头禅/习惯/反差）"
        - "关键决策是否出自角色既有动机而非剧情需要"
        - "配角是否与主角形成有效对照或张力"
      anchors:
        1: "角色扁平，动机不明，言行缺乏一致性"
        2: "角色有身份设定但行为模式单一，情感投入弱"
        3: "角色有基本辨识度，但性格单薄或成长不足"
        4: "角色立体、动机可信，有个别记忆点，情感代入较好"
        5: "角色立体、动机可信、有记忆点，观众有情感代入"
    - dimension: conflict_intensity
      label: "冲突强度"
      weight: 0.15
      description: "本集冲突是否尖锐、有层次、有对抗张力。"
      signals:
        - "对抗双方是否直接交锋（台词/行动对抗而非旁述）"
        - "冲突是否有升级（从言语到行动/从私下到公开）"
        - "冲突代价是否具体（输掉什么/失去什么）"
      anchors:
        1: "无有效冲突，剧情平铺直叙，角色间无对抗"
        2: "仅有摩擦级冲突，无对抗张力，代价抽象"
        3: "存在冲突但力度不足，或冲突解决过于轻易"
        4: "冲突尖锐且有对抗张力，仅层次或升级略欠"
        5: "冲突尖锐且多层级，对抗张力持续到本集结束"
    - dimension: payoff_density
      label: "爽点密度"
      weight: 0.15
      description: "短剧节奏下，本集是否包含足够的高光/反转/情绪释放点。"
      signals:
        - "高光/反转/情绪释放点的次数与分布位置"
        - "是否有打脸/身份揭晓/实力展示等明确爽点类型"
        - "爽点之间间隔是否过长（超过整集 1/3 无释放）"
      anchors:
        1: "无爽点，无反转，情绪全程平缓"
        2: "仅有 1 个弱爽点，爆发力不足，观众情绪无释放"
        3: "有 1-2 个轻量爽点，但密度偏低或爆发力不足"
        4: "爽点密度较好且分布合理，反转有力，个别释放点力度略欠"
        5: "爽点密集且分布合理，反转有力，情绪释放到位"
    - dimension: ending_hook
      label: "结尾钩子"
      weight: 0.15
      description: "本集结尾是否为下一集留下强悬念或期待。"
      signals:
        - "最后一场是否抛出未解决的冲突/悬念/反转"
        - "结尾是否落在情绪高点而非平缓收束"
        - "钩子与下一集是否形成明确的期待指向"
      anchors:
        1: "结尾无钩子，剧情到此自然结束，缺乏追看动力"
        2: "结尾有微弱余韵但无明确悬念，追看动力弱"
        3: "结尾有轻量悬念，但冲击力或延续性不足"
        4: "结尾抛出明确悬念或反转，追看动力较强"
        5: "结尾抛出强悬念/身份反转，强烈驱动观众追下一集"
    - dimension: pacing
      label: "节奏"
      weight: 0.10
      description: "场景推进与对白节奏是否紧凑，有无冗余拖沓。"
      signals:
        - "是否存在信息量为零的过场场景"
        - "对白是否在交代后仍重复同一信息"
        - "场景切换是否服务于剧情推进或情绪积累"
      anchors:
        1: "节奏拖沓，大量无效场景/对白，信息密度低"
        2: "节奏偏慢，存在明显冗余场景或重复对白"
        3: "节奏基本可用，但存在若干冗余段落"
        4: "节奏紧凑，个别段落信息密度略低"
        5: "节奏紧凑，场景切换高效，信息密度与情绪曲线匹配"
    - dimension: visualizability
      label: "画面感"
      weight: 0.05
      description: "动作描写与场景是否具备可拍摄的画面感，是否依赖抽象叙述。"
      signals:
        - "动作描写是否具体到可分镜（人物动作/镜头可见）"
        - "心理活动是否通过动作/表情外化而非独白"
        - "场景是否给出可拍摄的空间信息"
      anchors:
        1: "大量抽象叙述/心理独白，缺乏可拍摄动作，无法直接分镜"
        2: "以叙述推进为主，动作描写笼统，分镜需要大量补写"
        3: "部分场景可拍摄，但动作描写笼统或过少"
        4: "多数场景动作具体可拍，个别场景依赖叙述"
        5: "动作与场景描写具体可拍，可直接转化为镜头语言"
    - dimension: compliance_safety
      label: "合规安全"
      weight: 0.05
      description: "内容是否符合平台合规与内容安全要求，无红线风险。"
      signals:
        - "是否出现暴力/色情/违法/诱导不良行为的直接描写"
        - "价值观导向是否正确，是否存在美化不良行为"
        - "未成年人相关内容是否处理得当"
      anchors:
        1: "存在明显红线风险（违法、色情、诱导不良行为等）"
        2: "存在较明显的违规表述，需要改写后才能上线"
        3: "存在边缘表述或可能引发争议的内容"
        4: "内容基本安全，个别表述需注意尺度"
        5: "内容安全，无合规风险，符合平台规范"
