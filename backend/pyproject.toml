[project]
name = "drama-agent-backend"
version = "0.1.0"
description = "DramaAgent 后端 — 面向中文短剧创作的对话型 Agent 系统"
requires-python = ">=3.11"
readme = "../README.md"
license = { text = "MIT" }

# 依赖随任务推进逐阶段添加（A-01 → B-01 → …）
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    # B-01: FastAPI 启动、错误模型与健康检查
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "asyncpg>=0.30",
    "redis>=5.2",
    # B-02: ORM、Migration 与 Repository 基础
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.15",
    "greenlet>=3.1",
    "pgvector>=0.4",
    # C-01: Prompt Loader 与 Manifest（YAML 解析）
    "pyyaml>=6",
    # C-07: LangGraph 工作流引擎
    "langgraph>=0.2",
    "python-multipart>=0.0.32",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6",
    "ruff>=0.11",
    "mypy>=1.15",
    # B-01: 集成测试 HTTP 客户端
    "httpx>=0.28",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: 纯领域规则、Schema、工具、选择器，不访问网络",
    "integration: API + DB + Redis + 文件系统集成测试",
    "contract: API、事件、Prompt 输出 Schema 快照测试",
    "workflow: FakeLLM 驱动的节点、分支、恢复测试",
    "smoke: 手工触发真实模型最小链路，不进入普通 CI",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# 后续阶段随模块增加逐步收紧 ignore
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["asyncpg", "pgvector.*", "yaml"]
ignore_missing_imports = true

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "pytest-cov>=6", "ruff>=0.11", "mypy>=1.15", "httpx>=0.28"]

# ========== Coverage ==========

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
# MVP 阶段 70%；阶段 I 提升至 85%（core）/ 75%（overall）
fail_under = 70
exclude_also = [
    "def __repr__",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "class .*\\bProtocol\\):",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"
