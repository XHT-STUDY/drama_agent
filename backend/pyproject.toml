[project]
name = "drama-agent-backend"
version = "0.1.0"
description = "DramaAgent 后端 — 面向中文短剧创作的对话型 Agent 系统"
requires-python = ">=3.11"
readme = "../README.md"
license = { text = "MIT" }

# A-01 阶段仅声明最小依赖，业务依赖在后续阶段逐 Task 添加
dependencies = [
    "pydantic-settings>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
    "mypy>=1.15",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: 纯领域规则、Schema、工具、选择器，不访问网络",
    "integration: API + DB + Redis + 文件系统集成测试",
    "contract: API、事件、Prompt 输出 Schema 快照测试",
    "workflow: FakeLLM 驱动的节点、分支、恢复测试",
    "smoke: 手工触发真实模型最小链路，不进入普通 CI",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# 后续阶段随模块增加逐步收紧 ignore
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11", "mypy>=1.15"]
