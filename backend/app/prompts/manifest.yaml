# DramaAgent Prompt Manifest
# ===========================
# 集中管理所有 Prompt 模板的元数据。
# 每个 entry 记录 name、version、schema 绑定、模板路径和 changelog。
#
# 规则（见 DEV_PLAN §9.2）：
# - 同 name 不允许重复 version
# - input_schema / output_schema 必须可解析为 Pydantic 类
# - 模板文件相对路径指向 templates/ 目录
# - 修改 Prompt 内容必须同时更新 version 和 changelog

prompts:
  # ---- 需求归一化 ----
  - name: normalize_requirement
    version: "1.0.0"
    input_schema: RequirementInput
    output_schema: NormalizedRequirement
    owner: normalizer
    template: requirement.md
    changelog: "初始版本：接收 Idea/Outline/TXT/DOCX，归一化为结构化创作需求"
    user_content_vars: [user_input]

  # ---- StoryBible 生成 ----
  - name: story_bible
    version: "1.0.0"
    input_schema: StoryBibleInput
    output_schema: StoryBible
    owner: planner
    template: story_bible.md
    changelog: "初始版本：从归一化需求生成完整故事设定（人物、世界观、规则、伏笔）"
    user_content_vars: [normalized_requirement, rag_context]

  # ---- 分集大纲 ----
  - name: outline
    version: "1.0.0"
    input_schema: OutlineInput
    output_schema: EpisodeOutlineSet
    owner: planner
    template: outline.md
    changelog: "初始版本：一次生成 10 集分集大纲，每集含开头/冲突/爽点/结尾钩子"
    user_content_vars: [story_bible, rag_context]

  # ---- 单集剧本写作 ----
  - name: write_episode
    version: "1.0.0"
    input_schema: EpisodeWriterInput
    output_schema: ScriptDraft
    owner: writer
    template: episode_writer.md
    changelog: "初始版本：基于大纲与连续性状态撰写单集完整剧本（场景/对白/旁白）"
    user_content_vars: [story_bible, episode_outline, previous_summary, rag_context]
  - name: write_episode
    version: "1.1.0"
    input_schema: EpisodeWriterInput
    output_schema: ScriptDraft
    owner: writer
    template: episode_writer_v2.md
    changelog: "v1.1: 注入 ContextBuilder 按预算组装的创作上下文（G-02）——当前集大纲完整不截断，旧会话摘要经连续性段进入上下文"
    user_content_vars: [assembled_context]

  # ---- 剧集评估 ----
  - name: evaluate_episode
    version: "1.1.0"
    input_schema: EvaluationInput
    output_schema: EvaluationReport
    owner: evaluator
    template: evaluate_episode.md
    changelog: "v1.1: 输出与 EvaluationReport 对齐，issue 必带 evidence/diagnosis/suggestion 且定位场景，overall/need_revision 由服务端回填，注入 rubric 锚点与客观特征"
    user_content_vars: [story_bible, episode_outline, script_draft]

  # ---- 修订计划 ----
  - name: revision_plan
    version: "1.1.0"
    input_schema: RevisionPlanInput
    output_schema: RevisionPlan
    owner: reviser
    template: revision_plan.md
    changelog: "v1.1: 新增用户补充要求（user_instruction）段——置于锁定事实之下、不可违反锁定事实；其余保持有据可依的 operation 生成"
    user_content_vars: [user_instruction, script_draft, evaluation_report]

  # ---- 单集剧本修订 ----
  - name: revise_episode
    version: "1.0.0"
    input_schema: RevisionTaskInput
    output_schema: RevisionResult
    owner: reviser
    template: reviser.md
    changelog: "初始版本：按修订计划局部改写单集剧本，输出完整新稿与 operation 执行记录；显式列出 preserve 与禁止修改项"
    user_content_vars: [story_bible, episode_outline, script_draft]

  # ---- 连续性语义检查 ----
  - name: continuity_semantic_check
    version: "1.0.0"
    input_schema: ContinuityCheckInput
    output_schema: ContinuitySemanticCheck
    owner: reviser
    template: continuity_semantic_check.md
    changelog: "初始版本：修订稿语义层连续性复核（锁定事实反转 / 关键人物状态 / 伏笔一致性），规则检查通过后由独立 Skill 执行"
    user_content_vars: [episode_outline, script_draft]

  # ---- 剧集摘要 ----
  - name: summarize_episode
    version: "1.0.0"
    input_schema: SummaryInput
    output_schema: EpisodeSummary
    owner: summarizer
    template: episode_summary.md
    changelog: "初始版本：生成单集摘要，更新人物状态与伏笔追踪"
    user_content_vars: [script_draft]

  # ---- 会话摘要（中期记忆） ----
  - name: conversation_summary
    version: "1.0.0"
    input_schema: ConversationSummaryInput
    output_schema: ConversationSummaryBody
    owner: summarizer
    template: conversation_summary.md
    changelog: "初始版本：把超出短期窗口的旧会话消息滚动摘要为可读创作背景 (G-01)"
    user_content_vars: [conversation_transcript]

  # ---- 导入内容分类 ----
  - name: import_classifier
    version: "1.0.0"
    input_schema: ImportClassificationInput
    output_schema: ImportClassification
    owner: classifier
    template: import_classifier.md
    changelog: "初始版本：把上传文本分类为 idea_or_notes / outline / full_script / reference / unknown (G-04)"
    user_content_vars: [filename, text_preview]
