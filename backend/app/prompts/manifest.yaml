# DramaAgent Prompt Manifest
# ===========================
# 集中管理所有 Prompt 模板的元数据。
# 每个 entry 记录 name、version、schema 绑定、模板路径和 changelog。
#
# 规则（见 DEV_PLAN §9.2）：
# - 同 name 不允许重复 version
# - input_schema / output_schema 必须可解析为 Pydantic 类
# - 模板文件相对路径指向 templates/ 目录
# - 修改 Prompt 内容必须同时更新 version 和 changelog

prompts:
  # ---- 需求归一化 ----
  - name: normalize_requirement
    version: "1.0.0"
    input_schema: RequirementInput
    output_schema: NormalizedRequirement
    owner: normalizer
    template: requirement.md
    changelog: "初始版本：接收 Idea/Outline/TXT/DOCX，归一化为结构化创作需求"
    user_content_vars: [user_input]

  # ---- StoryBible 生成 ----
  - name: story_bible
    version: "1.0.0"
    input_schema: StoryBibleInput
    output_schema: StoryBible
    owner: planner
    template: story_bible.md
    changelog: "初始版本：从归一化需求生成完整故事设定（人物、世界观、规则、伏笔）"
    user_content_vars: [normalized_requirement, rag_context]

  # ---- 分集大纲 ----
  - name: outline
    version: "1.1.0"
    input_schema: OutlineInput
    output_schema: EpisodeOutlineSet
    owner: planner
    template: outline.md
    changelog: "v1.1：支持可配置集数 outline_count；修正输出字段名 (opening_hook/core_conflict)"
    user_content_vars: [story_bible, rag_context]

  # ---- 单集剧本写作 ----
  - name: write_episode
    version: "1.0.0"
    input_schema: EpisodeWriterInput
    output_schema: ScriptDraft
    owner: writer
    template: episode_writer.md
    changelog: "初始版本：基于大纲与连续性状态撰写单集完整剧本（场景/对白/旁白）"
    user_content_vars: [story_bible, episode_outline, previous_summary, rag_context]
  - name: write_episode
    version: "1.2.0"
    input_schema: EpisodeWriterInput
    output_schema: ScriptDraft
    owner: writer
    template: episode_writer_v2.md
    changelog: "v1.2: 剧本正文改为中文短剧剧本格式（场景头 `集-场 时间 内/外 地点` / 人物行 / △动作 / 对白·VO·OS 台词），新增 int_ext 与 line_type 字段，plain_text 由服务端从 scenes 确定性渲染。v1.1: 注入 ContextBuilder 按预算组装的创作上下文（G-02）——当前集大纲完整不截断，旧会话摘要经连续性段进入上下文"
    user_content_vars: [assembled_context]

  # ---- 剧集评估 ----
  - name: evaluate_episode
    version: "1.3.0"
    input_schema: EvaluationInput
    output_schema: EvaluationReport
    owner: evaluator
    template: evaluate_episode.md
    changelog: "v1.3: 新增大纲兑现核对——逐项核对本集大纲声明的关键事件/必需角色/伏笔引入与回收是否兑现，main_clarity 信号记录 outline_beats_delivered，未兑现项必须落 issue"
    user_content_vars: [story_bible, episode_outline, script_draft]

  # ---- 修订计划 ----
  - name: revision_plan
    version: "1.1.0"
    input_schema: RevisionPlanInput
    output_schema: RevisionPlan
    owner: reviser
    template: revision_plan.md
    changelog: "v1.1: 新增用户补充要求（user_instruction）段——置于锁定事实之下、不可违反锁定事实；其余保持有据可依的 operation 生成"
    user_content_vars: [user_instruction, script_draft, evaluation_report]

  # ---- 单集剧本修订 ----
  - name: revise_episode
    version: "1.1.0"
    input_schema: RevisionTaskInput
    output_schema: RevisionResult
    owner: reviser
    template: reviser.md
    changelog: "v1.1: script_draft 新增 int_ext / line_type 字段，plain_text 由服务端按中文短剧剧本格式渲染。v1.0: 按修订计划局部改写单集剧本，输出完整新稿与 operation 执行记录；显式列出 preserve 与禁止修改项"
    user_content_vars: [story_bible, episode_outline, script_draft]

  # ---- 连续性语义检查 ----
  - name: continuity_semantic_check
    version: "1.0.0"
    input_schema: ContinuityCheckInput
    output_schema: ContinuitySemanticCheck
    owner: reviser
    template: continuity_semantic_check.md
    changelog: "初始版本：修订稿语义层连续性复核（锁定事实反转 / 关键人物状态 / 伏笔一致性），规则检查通过后由独立 Skill 执行"
    user_content_vars: [episode_outline, script_draft]

  # ---- 剧集摘要 ----
  - name: summarize_episode
    version: "1.0.0"
    input_schema: SummaryInput
    output_schema: EpisodeSummary
    owner: summarizer
    template: episode_summary.md
    changelog: "初始版本：生成单集摘要，更新人物状态与伏笔追踪"
    user_content_vars: [script_draft]
  - name: episode_summary_v2
    version: "1.0.0"
    input_schema: EpisodeSummaryV2Input
    output_schema: EpisodeDelta
    owner: summarizer
    template: episode_summary_v2.md
    changelog: "v1.0(M-03):typed delta 提取——事实/角色知识/关系/伏笔/道具/时间线/作者未来计划;引用既有实体用稳定 ID,新实体不填 ID;未来计划与已发生事实分离;不含用户确认与来源字段"
    user_content_vars: [script_draft, continuity_context]

  # ---- 会话摘要（中期记忆） ----
  - name: conversation_summary
    version: "1.0.0"
    input_schema: ConversationSummaryInput
    output_schema: ConversationSummaryBody
    owner: summarizer
    template: conversation_summary.md
    changelog: "初始版本：把超出短期窗口的旧会话消息滚动摘要为可读创作背景 (G-01)"
    user_content_vars: [conversation_transcript]
  - name: conversation_summary
    version: "2.0.0"
    input_schema: ConversationSummaryV2Input
    output_schema: ConversationSummaryBody
    owner: summarizer
    template: conversation_summary_v2.md
    changelog: "v2(M-02):累计摘要——上一版累计摘要+新增区间合并输出,最新事实胜出,保留否决项/长期约束/未决问题"
    user_content_vars: [previous_summary, conversation_transcript]

  # ---- 导入内容分类 ----
  - name: import_classifier
    version: "1.0.0"
    input_schema: ImportClassificationInput
    output_schema: ImportClassification
    owner: classifier
    template: import_classifier.md
    changelog: "初始版本：把上传文本分类为 idea_or_notes / outline / full_script / reference / unknown (G-04)"
    user_content_vars: [filename, text_preview]


  # ---- 对话命令 Planner ----
  - name: agent_command_planner
    version: "1.5.0"
    input_schema: AgentPlannerInput
    output_schema: AgentPlannerOutput
    owner: planner
    template: agent_command_planner.md
    changelog: "v1.5：外部工具意图（MCP-03）——use_external_tool 计划只接受目录内的 qualified_tool_name，工具描述经非可信内容边界注入。v1.4：内容解释路由与目标优先级——剧情/场景/人物动机类问题判 answer+intent=explain（服务端读原文作答）；明确指定的对象/集数优先于活动上下文；仅指当前稿时才用活动上下文。v1.3：输出纪律强化——第一个字符必须是 {，禁止推理过程/解释/代码块围栏（真实模型 completion 被推理 token 挤爆导致截断）。v1.2：新增 continue 意图（确认门续跑）与 batch_size。v1.1：典型创作请求直接判 create_script；分阶段默认流程说明。v1.0：初始版本"
    user_content_vars: [user_request, project_context, active_context, external_tools]

  # ---- 原文内容解释（W1-03） ----
  - name: artifact_explainer
    version: "1.0.0"
    input_schema: ArtifactExplanationInput
    output_schema: ArtifactExplanationOutput
    owner: planner
    template: artifact_explainer.md
    changelog: "v1.0：初始版本——基于服务端给出的确切原文回答内容性问题，逐条引用 source_index（服务端回填 Artifact 引用并验证引文）"
    user_content_vars: [question, sources]


  # ---- 大纲修订 ----
  - name: outline_reviser
    version: "1.0.0"
    input_schema: OutlineRevisionInput
    output_schema: EpisodeOutlineSet
    owner: planner
    template: outline_reviser.md
    changelog: "初始版本：按用户约束修订分集大纲，输出完整 EpisodeOutlineSet（不接受 patch）"
    user_content_vars: [old_outline, story_bible, user_constraints]


  # ---- 目标达成评估 ----
  - name: agent_outcome_evaluator
    version: "1.0.0"
    input_schema: AgentOutcomeEvaluatorInput
    output_schema: AgentOutcomeEvaluatorOutput
    owner: planner
    template: agent_outcome_evaluator.md
    changelog: "初始版本：判断用户语义约束是否达成，并建议一次白名单后续意图（不得改写确定性结论）"
    user_content_vars: [user_constraints, goal]
